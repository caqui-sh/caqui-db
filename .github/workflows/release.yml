name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: caqui-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: caqui-linux-arm64
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: caqui-darwin-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run Tests
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --bin caqui --target ${{ matrix.target }}

      - name: Prepare Artifact
        run: |
          mv target/${{ matrix.target }}/release/caqui ${{ matrix.binary_name }}

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.binary_name }}
          generate_release_notes: true
